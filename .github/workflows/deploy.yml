name: Build y deploy landing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build y push de imagen Docker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -a
          source .env
          set +a

          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE_REF="ghcr.io/${OWNER}/${IMAGE_NAME}:${GITHUB_SHA}"

          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --build-arg APP_TITLE="$APP_TITLE" -t "$IMAGE_REF" .
          docker push "$IMAGE_REF"

          CID=$(docker create "$IMAGE_REF")
          rm -rf dist && mkdir dist
          docker cp "$CID:/usr/share/nginx/html/." dist/
          docker rm "$CID"

          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"
          echo "PAGES_BRANCH=$PAGES_BRANCH" >> "$GITHUB_ENV"

      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: ${{ env.PAGES_BRANCH }}
